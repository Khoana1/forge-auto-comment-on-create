name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # App không có UI Kit frontend — bước này chạy forge lint (validate manifest + bundle).
      - name: Build frontend
        run: npm run build
        env:
          # Tránh prompt analytics consent của Forge CLI trong CI (non-TTY).
          FORGE_DISABLE_ANALYTICS: true
