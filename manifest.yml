modules:
  trigger:
    - key: issue-created-welcome-comment
      function: welcomeComment
      events:
        - avi:jira:created:issue
      filter:
        ignoreSelf: true
        expression: event.issue.fields.project.key == 'SCRUM'
        onError: RECEIVE_AND_LOG
  webtrigger:
    - key: test-welcome-dedup
      function: testWelcomeDedup
      response:
        type: dynamic
  function:
    - key: welcomeComment
      handler: index.run
    - key: testWelcomeDedup
      handler: index.runDedupTest
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:issue:jira
    - write:comment:jira
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/55bc1724-a6d3-4c19-ab22-f6b9382ecedb
